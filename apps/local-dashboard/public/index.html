<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏠 Internes Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #00454A;
      --primary-light: #006d74;
      --accent: #FFB300;
      --bg: #0f1117;
      --bg-card: #1a1d24;
      --bg-hover: #22262f;
      --border: #2d3240;
      --text: #e8ecf0;
      --text-muted: #8892a0;
      --text-code: #c9d1d9;
      --success: #10B981;
      --error: #EF4444;
      --warning: #F59E0B;
      --radius: 10px;
      --sidebar-w: 280px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* === SIDEBAR === */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 20px 16px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #sidebar-header h1 {
      font-size: 17px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #sidebar-header p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    #search-box {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
    }

    #search-input:focus { border-color: var(--primary-light); }

    #project-list {
      overflow-y: auto;
      flex: 1;
      padding: 8px 0;
    }

    .project-item {
      padding: 10px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.15s;
    }

    .project-item:hover { background: var(--bg-hover); }
    .project-item.active { background: var(--bg-hover); border-left-color: var(--accent); }

    .project-item-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .project-icon {
      font-size: 16px;
      width: 20px;
      text-align: center;
    }

    .project-badge {
      margin-left: auto;
      font-size: 10px;
      background: var(--border);
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 10px;
    }

    .project-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
      padding-left: 28px;
    }

    #sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
    }

    /* === MAIN === */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      flex-shrink: 0;
    }

    #topbar h2 {
      font-size: 18px;
      font-weight: 700;
    }

    #topbar .project-tag {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .tabs {
      display: flex;
      gap: 0;
      margin-left: auto;
    }

    .tab-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn:first-child { border-radius: 6px 0 0 6px; }
    .tab-btn:last-child { border-radius: 0 6px 6px 0; border-left: none; }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .tab-btn:hover:not(.active) { background: var(--bg-hover); color: var(--text); }

    #content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    /* === OVERVIEW === */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .project-card:hover {
      border-color: var(--primary-light);
      transform: translateY(-1px);
    }

    .project-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .project-card-icon {
      font-size: 24px;
    }

    .project-card h3 {
      font-size: 15px;
      font-weight: 700;
    }

    .project-card p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .project-card-stats {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .stat-chip {
      background: var(--bg);
      padding: 3px 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* === CREDENTIALS === */
    .cred-section {
      margin-bottom: 24px;
    }

    .cred-section h3 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .cred-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cred-item {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      gap: 12px;
    }

    .cred-label {
      font-size: 12px;
      color: var(--text-muted);
      min-width: 160px;
      flex-shrink: 0;
    }

    .cred-value {
      font-family: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
      color: var(--text);
      flex: 1;
      word-break: break-all;
    }

    .cred-value.password {
      color: var(--warning);
      filter: blur(4px);
      transition: filter 0.2s;
      cursor: pointer;
    }

    .cred-value.password.revealed { filter: none; }

    .copy-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .copy-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
    .copy-btn.copied { background: var(--success); color: white; border-color: var(--success); }

    .type-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .type-command { background: #1e3a1e; color: #86efac; }
    .type-path { background: #1a1a3e; color: #a5b4fc; }
    .type-ip, .type-url { background: #1a2a3e; color: #7dd3fc; }
    .type-port { background: #1e2a1e; color: #6ee7b7; }
    .type-password { background: #3e1a1a; color: #fca5a5; }
    .type-text { background: #252525; color: #9ca3af; }

    /* === DOCS === */
    .doc-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .doc-file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .doc-file-item:hover { background: var(--bg-hover); border-color: var(--primary-light); }
    .doc-file-item.active { border-color: var(--accent); background: var(--bg-hover); }

    .doc-file-icon { font-size: 16px; }
    .doc-file-name { font-size: 14px; font-weight: 500; }
    .doc-file-path { font-size: 11px; color: var(--text-muted); margin-left: auto; }

    /* === DOC VIEWER === */
    #doc-viewer {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    #doc-viewer.open { display: block; }

    #doc-viewer-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    #doc-viewer-title {
      font-size: 14px;
      font-weight: 600;
      flex: 1;
    }

    #doc-viewer-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 2px 8px;
      border-radius: 4px;
    }

    #doc-viewer-close:hover { background: var(--border); color: var(--text); }

    #doc-viewer-body {
      padding: 24px;
      max-height: 70vh;
      overflow-y: auto;
    }

    /* Markdown styles */
    #doc-viewer-body h1,
    #doc-viewer-body h2,
    #doc-viewer-body h3,
    #doc-viewer-body h4 {
      color: var(--text);
      margin: 1.2em 0 0.5em;
    }

    #doc-viewer-body h1 { font-size: 22px; color: var(--accent); }
    #doc-viewer-body h2 { font-size: 17px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    #doc-viewer-body h3 { font-size: 15px; color: var(--primary-light); }
    #doc-viewer-body p { line-height: 1.7; margin: 0.6em 0; color: var(--text); }
    #doc-viewer-body ul, #doc-viewer-body ol { padding-left: 20px; margin: 0.5em 0; }
    #doc-viewer-body li { margin: 0.3em 0; line-height: 1.6; }
    #doc-viewer-body a { color: var(--accent); }

    #doc-viewer-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
      font-size: 13px;
    }

    #doc-viewer-body th, #doc-viewer-body td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }

    #doc-viewer-body th { background: var(--bg); font-weight: 600; color: var(--accent); }

    #doc-viewer-body code {
      background: var(--bg);
      color: var(--text-code);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
    }

    #doc-viewer-body pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 14px;
      overflow-x: auto;
      margin: 1em 0;
      position: relative;
    }

    #doc-viewer-body pre code {
      background: none;
      padding: 0;
    }

    .pre-copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--border);
      border: none;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .pre-copy-btn:hover { background: var(--primary); color: white; }
    .pre-copy-btn.copied { background: var(--success); color: white; }

    /* === TOAST === */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--success);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s;
      pointer-events: none;
      z-index: 9999;
    }

    #toast.show { opacity: 1; transform: none; }

    /* === LOADING === */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-state {
      display: flex;
      align-items: center;
      color: var(--text-muted);
      padding: 24px;
      font-size: 14px;
    }

    .empty-state {
      color: var(--text-muted);
      font-size: 14px;
      padding: 24px;
      text-align: center;
    }

    /* === ISSUES TAB === */
    .issue-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .issue-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .issue-item-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .issue-id {
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
      background: var(--bg);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .issue-title {
      font-size: 14px;
      flex: 1;
    }

    .issue-status {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    .status-done { background: #1a3a1a; color: #86efac; }
    .status-in_progress { background: #1a2a3e; color: #7dd3fc; }
    .status-todo { background: #252525; color: #9ca3af; }
    .status-blocked { background: #3e1a1a; color: #fca5a5; }
    .status-in_review { background: #2a2010; color: #fde68a; }
    .status-cancelled { background: #202020; color: #6b7280; }
    .status-backlog { background: #1e1e1e; color: #6b7280; }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside id="sidebar">
  <div id="sidebar-header">
    <h1>🏠 Internes Dashboard</h1>
    <p>Alle Projekte &amp; Zugänge</p>
  </div>
  <div id="search-box">
    <input id="search-input" type="text" placeholder="Suchen…" autocomplete="off" />
  </div>
  <nav id="project-list">
    <div class="loading-state"><span class="spinner"></span> Projekte laden…</div>
  </nav>
  <div id="sidebar-footer">
    Läuft auf Port <span id="footer-port">5555</span>
  </div>
</aside>

<!-- MAIN -->
<main id="main">
  <div id="topbar">
    <span id="topbar-icon" style="font-size:22px">🏠</span>
    <h2 id="topbar-title">Übersicht</h2>
    <div class="tabs">
      <button class="tab-btn active" data-tab="overview">Übersicht</button>
      <button class="tab-btn" data-tab="credentials">Zugänge</button>
      <button class="tab-btn" data-tab="docs">Dokumentation</button>
      <button class="tab-btn" data-tab="issues">Aufgaben</button>
    </div>
  </div>
  <div id="content-area">
    <div class="loading-state"><span class="spinner"></span> Lade Daten…</div>
  </div>
</main>

<!-- DOC VIEWER OVERLAY -->
<div id="doc-viewer">
  <div id="doc-viewer-header">
    <span id="doc-viewer-title">Dokument</span>
    <button id="doc-viewer-close">✕</button>
  </div>
  <div id="doc-viewer-body"></div>
</div>

<!-- TOAST -->
<div id="toast">✓ Kopiert!</div>

<script>
const toast = document.getElementById('toast');
let toastTimer;

function showToast(msg = '✓ Kopiert!') {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

async function copyToClipboard(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    if (btn) {
      btn.textContent = '✓ Kopiert';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Kopieren';
        btn.classList.remove('copied');
      }, 1800);
    }
    showToast();
  } catch {
    // fallback
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    showToast();
  }
}

// State
let projects = [];
let currentProject = null;
let currentTab = 'overview';

// Fetch projects
async function loadProjects() {
  try {
    const res = await fetch('/api/projects');
    projects = await res.json();
    renderSidebar();
    renderContent();
  } catch(e) {
    document.getElementById('project-list').innerHTML = '<div class="empty-state">Fehler beim Laden der Projekte</div>';
  }
}

function renderSidebar() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const list = document.getElementById('project-list');
  const filtered = projects.filter(p => !q || p.name.toLowerCase().includes(q) || p.description.toLowerCase().includes(q));

  let html = `
    <div class="project-item ${!currentProject ? 'active' : ''}" data-id="__overview">
      <div class="project-item-header">
        <span class="project-icon">🏠</span>
        Übersicht
        <span class="project-badge">${projects.length}</span>
      </div>
    </div>
  `;

  for (const p of filtered) {
    const active = currentProject && currentProject.id === p.id;
    html += `
      <div class="project-item ${active ? 'active' : ''}" data-id="${p.id}">
        <div class="project-item-header">
          <span class="project-icon">${p.icon}</span>
          ${escHtml(p.name)}
          <span class="project-badge">${p.docs.length}</span>
        </div>
        <div class="project-desc">${escHtml(p.description)}</div>
      </div>
    `;
  }

  list.innerHTML = html;

  list.querySelectorAll('.project-item').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      if (id === '__overview') {
        currentProject = null;
        currentTab = 'overview';
      } else {
        currentProject = projects.find(p => p.id === id);
        currentTab = 'credentials';
      }
      renderSidebar();
      renderContent();
      updateTopbar();
      updateTabs();
    });
  });
}

function updateTopbar() {
  const icon = document.getElementById('topbar-icon');
  const title = document.getElementById('topbar-title');
  if (currentProject) {
    icon.textContent = currentProject.icon;
    title.textContent = currentProject.name;
  } else {
    icon.textContent = '🏠';
    title.textContent = 'Übersicht';
  }
}

function updateTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === currentTab);
  });
}

function renderContent() {
  const area = document.getElementById('content-area');
  if (!currentProject && currentTab === 'overview') {
    renderOverview(area);
    return;
  }
  if (currentTab === 'credentials') {
    renderCredentials(area);
  } else if (currentTab === 'docs') {
    renderDocs(area);
  } else if (currentTab === 'issues') {
    renderIssues(area);
  } else {
    renderOverview(area);
  }
}

function renderOverview(area) {
  let html = '<div class="overview-grid">';
  for (const p of projects) {
    html += `
      <div class="project-card" data-id="${p.id}" style="border-top: 3px solid ${p.color}">
        <div class="project-card-header">
          <span class="project-card-icon">${p.icon}</span>
          <h3>${escHtml(p.name)}</h3>
        </div>
        <p>${escHtml(p.description)}</p>
        <div class="project-card-stats">
          <div class="stat-chip">📄 ${p.docs.length} Docs</div>
          <div class="stat-chip">🔑 ${p.credentialCount} Zugänge</div>
          ${!p.exists ? '<div class="stat-chip" style="color:var(--error)">⚠ Pfad fehlt</div>' : ''}
        </div>
      </div>
    `;
  }
  html += '</div>';
  area.innerHTML = html;

  area.querySelectorAll('.project-card').forEach(el => {
    el.addEventListener('click', () => {
      currentProject = projects.find(p => p.id === el.dataset.id);
      currentTab = 'credentials';
      renderSidebar();
      renderContent();
      updateTopbar();
      updateTabs();
    });
  });
}

async function renderCredentials(area) {
  if (!currentProject) { area.innerHTML = '<div class="empty-state">Kein Projekt ausgewählt</div>'; return; }

  area.innerHTML = '<div class="loading-state"><span class="spinner"></span> Zugänge laden…</div>';

  let creds = [], global = [];
  try {
    const res = await fetch(`/api/projects/${currentProject.id}/credentials`);
    const data = await res.json();
    creds = data.credentials || [];
    global = data.global || [];
  } catch {}

  if (creds.length === 0 && global.length === 0) {
    area.innerHTML = '<div class="empty-state">Keine Zugangsdaten für dieses Projekt hinterlegt</div>';
    return;
  }

  let html = '';

  if (creds.length > 0) {
    html += `<div class="cred-section"><h3>🔑 Zugangsdaten – ${escHtml(currentProject.name)}</h3><div class="cred-list">`;
    for (const c of creds) {
      html += renderCredItem(c);
    }
    html += '</div></div>';
  }

  if (global.length > 0) {
    html += `<div class="cred-section"><h3>🌐 Globale Infrastruktur</h3><div class="cred-list">`;
    for (const c of global) {
      html += renderCredItem(c);
    }
    html += '</div></div>';
  }

  area.innerHTML = html;

  area.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => copyToClipboard(btn.dataset.value, btn));
  });

  area.querySelectorAll('.cred-value.password').forEach(el => {
    el.addEventListener('click', () => el.classList.toggle('revealed'));
  });
}

function renderCredItem(c) {
  const isPassword = c.type === 'password';
  return `
    <div class="cred-item">
      <span class="cred-label">${escHtml(c.label)}</span>
      <span class="cred-value ${isPassword ? 'password' : ''}" ${isPassword ? 'title="Klicken zum Anzeigen"' : ''}>${escHtml(c.value)}</span>
      <span class="type-badge type-${c.type}">${c.type}</span>
      <button class="copy-btn" data-value="${escAttr(c.value)}">Kopieren</button>
    </div>
  `;
}

function renderDocs(area) {
  if (!currentProject) { area.innerHTML = '<div class="empty-state">Kein Projekt ausgewählt</div>'; return; }

  const docs = currentProject.docs;
  if (!docs || docs.length === 0) {
    area.innerHTML = '<div class="empty-state">Keine Dokumentationsdateien in diesem Projekt gefunden</div>';
    return;
  }

  const ext2icon = { '.md': '📝', '.txt': '📄' };

  let html = '<div id="doc-list-container">';

  // Group by directory
  const grouped = {};
  for (const doc of docs) {
    const parts = doc.path.split('/');
    const dir = parts.length > 1 ? parts.slice(0, -1).join('/') : 'root';
    (grouped[dir] = grouped[dir] || []).push(doc);
  }

  for (const [dir, files] of Object.entries(grouped)) {
    if (dir !== 'root') {
      html += `<div style="margin-top:16px;margin-bottom:6px;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;">📁 ${escHtml(dir)}</div>`;
    }
    html += '<div class="doc-list">';
    for (const doc of files) {
      const ext = doc.name.match(/\.\w+$/)?.[0] || '';
      const icon = ext2icon[ext.toLowerCase()] || '📄';
      html += `
        <div class="doc-file-item" data-path="${escAttr(currentProject.path + '/' + doc.path)}">
          <span class="doc-file-icon">${icon}</span>
          <span class="doc-file-name">${escHtml(doc.name)}</span>
          <span class="doc-file-path">${escHtml(doc.path)}</span>
        </div>
      `;
    }
    html += '</div>';
  }

  html += '</div>';
  area.innerHTML = html;

  area.querySelectorAll('.doc-file-item').forEach(el => {
    el.addEventListener('click', () => openDoc(el.dataset.path, el.querySelector('.doc-file-name').textContent));
  });
}

async function openDoc(fullPath, name) {
  const viewer = document.getElementById('doc-viewer');
  const body = document.getElementById('doc-viewer-body');
  const title = document.getElementById('doc-viewer-title');

  title.textContent = name;
  body.innerHTML = '<div class="loading-state"><span class="spinner"></span> Laden…</div>';
  viewer.classList.add('open');

  try {
    const res = await fetch('/api/docs?path=' + encodeURIComponent(fullPath));
    const data = await res.json();
    if (data.error) {
      body.innerHTML = `<div class="empty-state" style="color:var(--error)">${escHtml(data.error)}</div>`;
      return;
    }
    body.innerHTML = data.html;

    // Add copy buttons to all pre blocks
    body.querySelectorAll('pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'pre-copy-btn';
      btn.textContent = 'Kopieren';
      btn.addEventListener('click', () => {
        const code = pre.querySelector('code');
        const text = code ? code.textContent : pre.textContent;
        copyToClipboard(text, btn);
        btn.textContent = '✓';
        setTimeout(() => btn.textContent = 'Kopieren', 1800);
      });
      pre.style.position = 'relative';
      pre.appendChild(btn);
    });
  } catch(e) {
    body.innerHTML = `<div class="empty-state" style="color:var(--error)">Fehler: ${escHtml(String(e))}</div>`;
  }
}

async function renderIssues(area) {
  if (!currentProject) { area.innerHTML = '<div class="empty-state">Kein Projekt ausgewählt</div>'; return; }

  area.innerHTML = '<div class="loading-state"><span class="spinner"></span> Aufgaben laden…</div>';

  let issues = [];
  try {
    const res = await fetch(`/api/paperclip/issues?projectId=${encodeURIComponent(currentProject.id)}`);
    issues = await res.json();
    if (!Array.isArray(issues)) issues = [];
  } catch {
    area.innerHTML = '<div class="empty-state">Paperclip nicht erreichbar</div>';
    return;
  }

  if (issues.length === 0) {
    area.innerHTML = '<div class="empty-state">Keine Aufgaben für dieses Projekt</div>';
    return;
  }

  const statusOrder = ['in_progress', 'todo', 'in_review', 'blocked', 'backlog', 'done', 'cancelled'];
  issues.sort((a, b) => (statusOrder.indexOf(a.status) - statusOrder.indexOf(b.status)) || a.identifier.localeCompare(b.identifier));

  let html = '<div class="issue-list">';
  for (const issue of issues) {
    html += `
      <div class="issue-item">
        <div class="issue-item-header">
          <span class="issue-id">${escHtml(issue.identifier)}</span>
          <span class="issue-title">${escHtml(issue.title)}</span>
          <span class="issue-status status-${issue.status}">${statusLabel(issue.status)}</span>
        </div>
      </div>
    `;
  }
  html += '</div>';
  area.innerHTML = html;
}

function statusLabel(s) {
  const map = {
    done: '✓ Fertig', in_progress: '⚡ In Arbeit', todo: '○ Todo',
    blocked: '🚫 Blockiert', in_review: '👁 Review', cancelled: '✗ Abgebrochen',
    backlog: '📋 Backlog',
  };
  return map[s] || s;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Tab buttons
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!currentProject && btn.dataset.tab !== 'overview') return;
    currentTab = btn.dataset.tab;
    updateTabs();
    renderContent();
  });
});

// Doc viewer close
document.getElementById('doc-viewer-close').addEventListener('click', () => {
  document.getElementById('doc-viewer').classList.remove('open');
});

// Search
document.getElementById('search-input').addEventListener('input', () => renderSidebar());

// Load
loadProjects();
fetch('/api/system').then(r => r.json()).then(data => {
  document.getElementById('footer-port').textContent = data.port;
});
</script>

</body>
</html>
