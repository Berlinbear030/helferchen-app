name: Website CI

on:
  push:
    paths:
      - 'apps/website/**'
  pull_request:
    paths:
      - 'apps/website/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/website/package-lock.json
      - name: Install dependencies
        run: cd apps/website && npm ci
      - name: Build
        run: cd apps/website && npm run build
      - name: Deploy via FTP
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.webspace.bz
          username: kd250524ftp1
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: apps/website/dist/
          server-dir: /
          protocol: ftps
