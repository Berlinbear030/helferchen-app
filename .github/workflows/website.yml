name: Website CI

on:
  push:
    paths:
      - 'apps/website/**'
  pull_request:
    paths:
      - 'apps/website/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/website/package-lock.json
      - name: Install dependencies
        run: cd apps/website && npm install
      - name: Build
        run: cd apps/website && npm run build
