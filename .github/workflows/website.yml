name: Website CI

on:
  push:
    paths:
      - 'apps/website/**'
  pull_request:
    paths:
      - 'apps/website/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/website/package-lock.json
      - name: Install dependencies
        run: cd apps/website && npm ci
      - name: Build
        run: cd apps/website && npm run build
      - name: Copy .htaccess to dist
        run: cp apps/website/public/.htaccess apps/website/dist/.htaccess
      - name: Deploy via FTP to Dogado
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: web214.dogado.net
          username: h770906
          password: ${{ secrets.DOGADO_FTP_PASSWORD }}
          local-dir: apps/website/dist/
          server-dir: /httpdocs/
          protocol: ftp
