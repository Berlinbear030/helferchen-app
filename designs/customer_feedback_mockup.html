<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helferchen - Ihr Feedback</title>
    <style>
        :root {
            --primary-blue: #003366;
            --text-dark: #222222;
            --bg-cream: #FFFDD0;
            --white: #FFFFFF;
        }
        body { font-family: Arial, sans-serif; background-color: var(--bg-cream); color: var(--text-dark); font-size: 24px; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: var(--white); padding: 30px; border-radius: 20px; }
        h1 { color: var(--primary-blue); font-size: 32px; }
        .question { margin-bottom: 30px; }
        .btn-group { display: flex; gap: 20px; margin-top: 10px; }
        .btn { padding: 20px 40px; font-size: 24px; border: 2px solid var(--primary-blue); border-radius: 10px; cursor: pointer; background: var(--white); }
        .btn:active { background: var(--primary-blue); color: var(--white); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Wie war unser Helfer?</h1>
        <div class="question">
            <p>1. War der Helfer pünktlich?</p>
            <div class="btn-group">
                <button class="btn">Ja</button>
                <button class="btn">Nein</button>
            </div>
        </div>
        <div class="question">
            <p>2. War der Helfer freundlich?</p>
            <div class="btn-group">
                <button class="btn">Ja</button>
                <button class="btn">Nein</button>
            </div>
        </div>
        <button class="btn" style="width:100%; background: var(--primary-blue); color:white;">Feedback senden</button>
    </div>
</body>
</html>
