<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helferchen Employee App - Report & Signature</title>
    <style>
        :root {
            --primary-blue: #003366;
            --accent-orange: #FF8C00;
            --bg-gray: #F4F7F6;
            --white: #FFFFFF;
        }

        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone {
            width: 375px;
            height: 812px;
            background-color: var(--bg-gray);
            border: 12px solid #000;
            border-radius: 40px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header { background-color: var(--primary-blue); color: white; padding: 40px 20px 20px 20px; text-align: center; }
        .content { flex: 1; padding: 20px; }
        
        .card { background-color: var(--white); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        
        textarea { width: 100%; height: 100px; border: 1px solid #ccc; border-radius: 10px; padding: 10px; box-sizing: border-box; }
        
        .signature-pad { width: 100%; height: 150px; background-color: #eee; border: 2px dashed #ccc; border-radius: 10px; margin-bottom: 20px; }
        
        .btn { display: block; width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; text-align: center; cursor: pointer; margin-top: 10px;}
        .btn-primary { background-color: var(--primary-blue); color: white; }
    </style>
</head>
<body>
    <div class="phone">
        <header><h1>Bericht</h1></header>
        <div class="content">
            <div class="card">
                <label>Was wurde erledigt?</label>
                <textarea placeholder="Kurze Beschreibung..."></textarea>
            </div>
            <div class="card">
                <label>Kundenunterschrift</label>
                <div class="signature-pad"></div>
                <button class="btn btn-primary">Abschließen & Speichern</button>
            </div>
        </div>
    </div>
</body>
</html>
