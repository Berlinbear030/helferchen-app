<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Helferchen Web Portal</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        header { border-bottom: 1px solid #ddd; padding-bottom: 20px; margin-bottom: 20px; }
        h1 { color: #003366; }
        .planner-grid { display: grid; grid-template-columns: 250px 1fr; gap: 20px; }
        .calendar { border: 1px solid #ddd; padding: 15px; border-radius: 8px; }
        .map-area { height: 400px; background: #eee; border: 1px solid #ddd; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Mitarbeiter-Portal: Einsatzplan</h1></header>
        <div class="planner-grid">
            <div class="calendar">
                <h3>Juni 2026</h3>
                <p>Mo | Di | Mi | Do | Fr | Sa | So</p>
                <div style="font-weight: bold; color: var(--accent-orange, #FF8C00);">04 (Heute)</div>
            </div>
            <div>
                <div class="map-area">Google Maps View (Placeholder)</div>
                <div style="margin-top: 15px;">
                    <h3>Aufgaben heute:</h3>
                    <ul>
                        <li>09:00 - 12:00: TV & Internet einrichten (Berliner Str. 42)</li>
                        <li>14:30 - 16:30: Einkaufen & Fensterputzen (Königin-Luise-Str. 12)</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
